<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Current.NG</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ed;color:#17241d;font-family:"DM Sans",sans-serif}.shell{width:min(1050px,calc(100% - 40px));margin:auto}.top{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e1e2d9}.brand{display:flex;align-items:center;gap:9px;font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:700}.mark{width:31px;height:31px;display:grid;place-items:center;border-radius:10px;background:#145da0;color:#ffd447}.actions{display:flex;gap:8px}.actions a,.actions button{height:38px;padding:0 13px;border:1px solid #dfe1d7;border-radius:7px;background:#fbfaf6;color:#445247;font-weight:700;text-decoration:none}.intro{display:flex;align-items:end;justify-content:space-between;padding:38px 0 24px}.eyebrow{color:#6d8067;font-size:9px;font-weight:700;letter-spacing:1.2px}h1{margin:8px 0 0;font-family:"Space Grotesk",sans-serif;font-size:38px}.stats{display:flex;gap:10px}.stat{min-width:110px;padding:12px;border-radius:8px;background:#fbfaf6;border:1px solid #e1e2d8}.stat strong{display:block;font-family:"Space Grotesk",sans-serif;font-size:24px}.stat span{color:#7d8579;font-size:9px}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{padding:9px 12px;border:1px solid #dfe1d7;border-radius:7px;background:#fbfaf6;color:#737c73;font-size:11px;font-weight:700}.tab.active{background:#123f72;border-color:#123f72;color:#fff}.reports{display:grid;gap:10px}.report{display:grid;grid-template-columns:1fr auto;gap:16px;padding:16px;border:1px solid #e1e2d8;border-radius:9px;background:#fbfaf6}.report h3{margin:0 0 5px;font-family:"Space Grotesk",sans-serif}.meta{color:#7d8579;font-size:10px}.report-actions{display:flex;align-items:center;gap:7px}.approve,.reject,.remove{height:38px;padding:0 12px;border-radius:7px;font-weight:700}.approve{border:0;background:#587b40;color:#fff}.reject,.remove{border:1px solid #dfe1d7;background:#fff;color:#7b4b40}.status{display:inline-block;margin-left:7px;padding:3px 7px;border-radius:10px;font-size:8px}.pending{background:#f3e6d4;color:#966b38}.approved{background:#e0ebd5;color:#527740}.solved{background:#dce8f3;color:#145da0}.problem-solved{height:38px;padding:0 12px;border:0;border-radius:7px;background:#145da0;color:#fff;font-weight:700}.rejected{background:#f1dfdb;color:#945a4b}.empty{padding:32px;text-align:center;border:1px dashed #d8dccf;border-radius:9px;color:#858c82}
.modal-overlay{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(18,63,114,.55)}.modal-overlay.visible{display:flex}.note-modal{width:min(430px,100%);padding:22px;border-radius:11px;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.18)}.note-modal h2{margin:0 0 7px;font-family:"Space Grotesk",sans-serif;font-size:22px}.note-modal p{color:#737b72;font-size:11px}.note-modal textarea{width:100%;min-height:100px;resize:vertical;padding:10px;border:1px solid #d8ddd1;border-radius:7px;font-family:inherit}.note-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.note-modal-actions button{height:38px;padding:0 12px;border-radius:7px;font-weight:700}.note-cancel{border:1px solid #dfe1d7;background:#fff}.note-confirm{border:0;background:#587b40;color:#fff}
@media(max-width:700px){.shell{width:calc(100% - 24px)}.intro{align-items:flex-start;gap:20px}.stats{display:none}.report{grid-template-columns:1fr}.actions a{display:none}}
</style></head>
<body><div class="shell">
<header class="top"><div class="brand"><span class="mark">⚡</span>Current.NG <span style="color:#6d8067;font-size:12px">Admin</span></div><div class="actions"><a href="index.html">View main page</a><button id="logout" type="button">Log out</button></div></header>
<main><div class="intro"><div><p class="eyebrow">COMPLAINT MANAGEMENT</p><h1>Review outage reports</h1></div><div class="stats"><div class="stat"><strong id="pending-count">0</strong><span>Pending</span></div><div class="stat"><strong id="approved-count">0</strong><span>Approved</span></div></div></div><div class="tabs"><button class="tab active" data-filter="pending">Pending</button><button class="tab" data-filter="approved">Approved</button><button class="tab" data-filter="rejected">Rejected</button><button class="tab" data-filter="solved">Solved</button></div><section class="reports" id="reports"></section></main></div>
<div class="modal-overlay" id="note-overlay" role="dialog" aria-modal="true"><div class="note-modal"><p class="eyebrow" id="note-kicker">ADMIN NOTE</p><h2 id="note-title">Add a note</h2><p id="note-copy">This note will be saved with the complaint.</p><textarea id="admin-note" placeholder="Example: Complaint verified with field officer"></textarea><div class="note-modal-actions"><button class="note-cancel" id="note-cancel" type="button">Cancel</button><button class="note-confirm" id="note-confirm" type="button">Save and continue</button></div></div></div>
<script>
if(sessionStorage.getItem("currentNgRole")!=="admin"||sessionStorage.getItem("currentNgAccess")!=="granted")location.replace("login.html");
const key="currentNgComplaints";let storedReports=[];try{storedReports=JSON.parse(localStorage.getItem(key)||"[]")||[]}catch(error){storedReports=[]}if(!Array.isArray(storedReports))storedReports=[];let reports=storedReports.filter((report)=>report.location!=="Maryland Junction");
let filter="pending";
function save(){localStorage.setItem(key,JSON.stringify(reports))}
function escapeHtml(v){const d=document.createElement("div");d.textContent=v;return d.innerHTML}
function render(){const list=reports.filter(r=>r.status===filter);document.querySelector("#pending-count").textContent=reports.filter(r=>r.status==="pending").length;document.querySelector("#approved-count").textContent=reports.filter(r=>r.status==="approved").length;const box=document.querySelector("#reports");if(!list.length){box.innerHTML="<div class='empty'>No "+filter+" complaints.</div>";return}box.innerHTML=list.map(r=>`<article class="report"><div><h3>${escapeHtml(r.location)} <span class="status ${r.status}">${r.status}</span></h3><div class="meta">Out for ${escapeHtml(r.duration)} · ${escapeHtml(r.created)} · ${escapeHtml(r.provider || "Provider not provided")}${r.coordinates ? " · " + escapeHtml(r.coordinates) : ""}${r.adminNote ? " · Note: " + escapeHtml(r.adminNote) : ""}</div></div><div class="report-actions">${r.status==="pending"?`<button class="approve" data-action="approved" data-id="${r.id}">Approve</button><button class="reject" data-action="rejected" data-id="${r.id}">Reject</button>`:r.status==="approved"?`<button class="problem-solved" data-action="solved" data-id="${r.id}">Problem solved</button><button class="remove" data-action="remove" data-id="${r.id}">Remove</button>`:`<button class="remove" data-action="remove" data-id="${r.id}">Remove</button>`}</div></article>`).join("")}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{document.querySelector(".tab.active").classList.remove("active");t.classList.add("active");filter=t.dataset.filter;render()}));
let pendingAction=null;let pendingId=null;
function openNote(action,id){pendingAction=action;pendingId=id;const isRemove=action==="remove";const isSolved=action==="solved";document.querySelector("#note-kicker").textContent=isRemove?"REMOVE COMPLAINT":isSolved?"MARK AS SOLVED":action==="approved"?"APPROVE COMPLAINT":"REJECT COMPLAINT";document.querySelector("#note-title").textContent=isRemove?"Remove this complaint?":isSolved?"Mark problem as solved?":action==="approved"?"Approve with a note":"Reject with a note";document.querySelector("#note-copy").textContent=isRemove?"The complaint will be permanently removed from review records.":isSolved?"Add a closing note. This will remove the complaint from the main page.":"Add a visible admin review note before the complaint is updated.";document.querySelector("#admin-note").value="";document.querySelector("#note-overlay").classList.add("visible");document.querySelector("#admin-note").focus()}
document.querySelector("#reports").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;openNote(b.dataset.action,String(b.dataset.id))});
document.querySelector("#note-cancel").addEventListener("click",()=>document.querySelector("#note-overlay").classList.remove("visible"));
document.querySelector("#note-overlay").addEventListener("click",e=>{if(e.target.id==="note-overlay")document.querySelector("#note-overlay").classList.remove("visible")});
document.querySelector("#note-confirm").addEventListener("click",()=>{const note=document.querySelector("#admin-note").value.trim();if(pendingAction==="remove")reports=reports.filter(r=>String(r.id)!==String(pendingId));else{const r=reports.find(x=>String(x.id)===String(pendingId));if(r){r.status=pendingAction;r.created="Reviewed just now";r.adminNote=note||"No note added"}}save();document.querySelector("#note-overlay").classList.remove("visible");if(pendingAction==="approved")window.location.href="index.html";else if(pendingAction==="solved"){filter="solved";document.querySelector(".tab.active").classList.remove("active");document.querySelector(".tab[data-filter=\"solved\"]").classList.add("active");render()}else render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelector("#note-overlay").classList.remove("visible")});
document.querySelector("#logout").addEventListener("click",()=>{sessionStorage.clear();location.href="login.html"});render();
</script>
</body></html>
